<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="t-bb d-bb">
  <title id="t-bb">Comparação Visual: Bagging (Random Forest) vs. Boosting (XGBoost)</title>
  <desc id="d-bb">À esquerda, a Random Forest treina árvores independentes em paralelo com bootstrap e subconjunto de colunas e decide por votação. À direita, o XGBoost treina árvores em sequência, onde cada árvore corrige o gradiente de erro da anterior.</desc>
  <rect width="860" height="300" rx="8" fill="#050505"/>
  <line x1="430" y1="20" x2="430" y2="280" stroke="#1c1c21" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Lado Esquerdo: Random Forest (Bagging) -->
  <text x="215" y="36" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Random Forest — Bagging em Paralelo (Reduz Variância)</text>
  <rect x="30" y="65" width="95" height="42" rx="6" fill="#0a0a0c" stroke="#52525b" stroke-width="1.2"/>
  <text x="77" y="90" font-family="sans-serif" font-size="11.5" fill="#d4d4d8" text-anchor="middle">Bootstrap 1</text>
  <rect x="30" y="130" width="95" height="42" rx="6" fill="#0a0a0c" stroke="#52525b" stroke-width="1.2"/>
  <text x="77" y="155" font-family="sans-serif" font-size="11.5" fill="#d4d4d8" text-anchor="middle">Bootstrap 2</text>
  <rect x="30" y="195" width="95" height="42" rx="6" fill="#0a0a0c" stroke="#52525b" stroke-width="1.2"/>
  <text x="77" y="220" font-family="sans-serif" font-size="11.5" fill="#d4d4d8" text-anchor="middle">Bootstrap B</text>

  <rect x="165" y="65" width="95" height="42" rx="6" fill="#141007" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="212" y="90" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fcd34d" text-anchor="middle">Árvore 1</text>
  <rect x="165" y="130" width="95" height="42" rx="6" fill="#141007" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="212" y="155" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fcd34d" text-anchor="middle">Árvore 2</text>
  <rect x="165" y="195" width="95" height="42" rx="6" fill="#141007" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="212" y="220" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fcd34d" text-anchor="middle">Árvore B</text>

  <rect x="300" y="115" width="105" height="72" rx="8" fill="#1c1406" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="352" y="146" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fef08a" text-anchor="middle">Votação por</text>
  <text x="352" y="166" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#fef08a" text-anchor="middle">Maioria</text>
  <g stroke="#71717a" stroke-width="1.4">
    <line x1="125" y1="86" x2="165" y2="86"/>
    <line x1="125" y1="151" x2="165" y2="151"/>
    <line x1="125" y1="216" x2="165" y2="216"/>
    <line x1="260" y1="86" x2="300" y2="140"/>
    <line x1="260" y1="151" x2="300" y2="151"/>
    <line x1="260" y1="216" x2="300" y2="162"/>
  </g>
  <text x="215" y="272" font-family="sans-serif" font-size="10.5" fill="#8e8e98" text-anchor="middle">Classe rara (0,39%): sorteio de colunas dilui RISCO no voto</text>

  <!-- Lado Direito: XGBoost (Boosting) -->
  <text x="645" y="36" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#34d399" text-anchor="middle">XGBoost — Boosting Sequencial (Reduz Viés / Resíduos)</text>
  <rect x="460" y="110" width="90" height="65" rx="6" fill="#06140f" stroke="#10b981" stroke-width="1.4"/>
  <text x="505" y="138" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">Rodada 1</text>
  <text x="505" y="156" font-family="sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">f₁(x)</text>

  <rect x="595" y="110" width="90" height="65" rx="6" fill="#06140f" stroke="#10b981" stroke-width="1.4"/>
  <text x="640" y="138" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">Rodada 2</text>
  <text x="640" y="156" font-family="sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">corrige gᵢ, hᵢ</text>

  <rect x="730" y="110" width="105" height="65" rx="28" fill="#061c14" stroke="#34d399" stroke-width="1.5"/>
  <text x="782" y="138" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#a7f3d0" text-anchor="middle">Soma Aditiva</text>
  <text x="782" y="156" font-family="sans-serif" font-size="10.5" fill="#6ee7b7" text-anchor="middle">Σ η · fₜ(x)</text>

  <g stroke="#10b981" stroke-width="1.6">
    <line x1="550" y1="142" x2="595" y2="142"/>
    <line x1="685" y1="142" x2="730" y2="142"/>
  </g>
  <text x="572" y="98" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle">resíduo</text>
  <text x="645" y="272" font-family="sans-serif" font-size="10.5" fill="#8e8e98" text-anchor="middle">Foca nas amostras difíceis (RISCO=100%), mas exige 36 árvores (42,5x mais lento)</text>
</svg>
